<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimikyu — Transformações Geométricas 2D</title>
<style>
  html, body { margin: 0; padding: 0; background: #05040a; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
  #hud {
    position: absolute; top: 14px; left: 14px;
    color: #d8cce8; font: 13px/1.5 'Trebuchet MS', sans-serif;
    background: rgba(10, 6, 20, 0.55); padding: 10px 14px;
    border-radius: 10px; border: 1px solid rgba(180,140,220,0.25);
    backdrop-filter: blur(2px);
    max-width: 260px;
  }
  #hud b { color: #f2b8d8; }
  #zoomLabel {
    position: absolute; bottom: 14px; right: 16px;
    color: #b7a6cf; font: 12px monospace;
    background: rgba(10,6,20,0.5); padding: 6px 10px; border-radius: 8px;
    border: 1px solid rgba(180,140,220,0.2);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <b>Mimikyu</b><br>
  Setas: mover | Clique: ir até o ponto<br>
  Mouse: cabeça acompanha o olhar<br>
  Espaço: susto | Scroll ou +/-: zoom | R: reset
</div>
<div id="zoomLabel">zoom: 100%</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const zoomLabel = document.getElementById('zoomLabel');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let t = 0;
let lastFrame = null;

let px = 0, py = 0;
let targetPX = null, targetPY = null;
let walking = false;
let walkPhase = 0;

let zoom = 1;

let mouseX = null, mouseY = null;
let headTiltTarget = 0;
let headTilt = 0;

let flinchTimer = 10;

const stars = [];
for (let i = 0; i < 90; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.55,
    s: 0.5 + Math.random() * 1.6,
    ph: Math.random() * Math.PI * 2,
    sp: 0.6 + Math.random() * 1.4
  });
}

const fireflies = [];
for (let i = 0; i < 14; i++) {
  fireflies.push({
    x: Math.random(),
    y: 0.55 + Math.random() * 0.35,
    r: 0.05 + Math.random() * 0.05,
    ph: Math.random() * Math.PI * 2,
    sp: 0.5 + Math.random() * 0.8
  });
}

const wisps = [
  { radius: 70, speed: 0.6, phase: 0, size: 5, color: 'rgba(180,220,255,0.85)' },
  { radius: 95, speed: -0.42, phase: 2.1, size: 4, color: 'rgba(230,180,255,0.8)' },
  { radius: 55, speed: 0.85, phase: 4.4, size: 3.5, color: 'rgba(255,210,230,0.85)' }
];

function bounds() {
  return {
    minX: canvas.width * 0.15,
    maxX: canvas.width * 0.85,
    minY: canvas.height * 0.55,
    maxY: canvas.height * 0.92
  };
}

function initPosition() {
  const b = bounds();
  px = canvas.width / 2;
  py = (b.minY + b.maxY) / 2;
}
initPosition();

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, k) { return a + (b - a) * k; }

function drawEllipseArc(rx, ry) {
  ctx.save();
  ctx.scale(1, ry / rx);
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, Math.PI * 2);
  ctx.restore();
}

function skyAndMoon() {
  const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0, '#120a24');
  g.addColorStop(0.55, '#1c1030');
  g.addColorStop(1, '#241436');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const mx = canvas.width * 0.8, my = canvas.height * 0.18, mr = Math.min(canvas.width, canvas.height) * 0.07;
  ctx.save();
  ctx.translate(mx, my);
  const glow = ctx.createRadialGradient(0, 0, mr * 0.6, 0, 0, mr * 3);
  glow.addColorStop(0, 'rgba(230,225,255,0.25)');
  glow.addColorStop(1, 'rgba(230,225,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, mr * 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#efeaf7';
  ctx.beginPath();
  ctx.arc(0, 0, mr, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(180,175,205,0.35)';
  [[-mr*0.3,-mr*0.2,mr*0.18],[mr*0.25,mr*0.15,mr*0.13],[mr*0.05,-mr*0.4,mr*0.09]].forEach(c => {
    ctx.beginPath();
    ctx.arc(c[0], c[1], c[2], 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  stars.forEach(st => {
    const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * st.sp + st.ph));
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fillRect(st.x * canvas.width, st.y * canvas.height, st.s, st.s);
  });
}

function treeSilhouette(x, y, scale, sway) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(sway);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#0b0714';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-6, -40, 0, -90);
  ctx.quadraticCurveTo(6, -40, 0, 0);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, -95, 34, 30, 0, 0, Math.PI * 2);
  ctx.ellipse(-24, -78, 22, 20, 0, 0, Math.PI * 2);
  ctx.ellipse(24, -80, 24, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function tombstone(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#14101f';
  ctx.beginPath();
  ctx.moveTo(-18, 0);
  ctx.lineTo(-18, -30);
  ctx.quadraticCurveTo(-18, -46, 0, -46);
  ctx.quadraticCurveTo(18, -46, 18, -30);
  ctx.lineTo(18, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(160,140,190,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -36);
  ctx.lineTo(0, -14);
  ctx.moveTo(-8, -25);
  ctx.lineTo(8, -25);
  ctx.stroke();
  ctx.restore();
}

function ground() {
  const b = bounds();
  const g = ctx.createLinearGradient(0, b.minY - 40, 0, canvas.height);
  g.addColorStop(0, '#241a34');
  g.addColorStop(1, '#0c0815');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, b.minY - 40);
  ctx.quadraticCurveTo(canvas.width / 2, b.minY - 70, canvas.width, b.minY - 40);
  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(150,120,190,0.12)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const yy = b.minY + i * 26;
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.quadraticCurveTo(canvas.width / 2, yy - 14, canvas.width, yy);
    ctx.stroke();
  }
}

function fireflyLayer() {
  fireflies.forEach(f => {
    const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * f.sp + f.ph));
    const fx = f.x * canvas.width + Math.sin(t * f.sp * 0.7 + f.ph) * 14;
    const fy = f.y * canvas.height + Math.cos(t * f.sp * 0.5 + f.ph) * 10;
    ctx.save();
    ctx.translate(fx, fy);
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, 10);
    grd.addColorStop(0, `rgba(210,255,190,${a})`);
    grd.addColorStop(1, 'rgba(210,255,190,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

const CLOTH = '#d9c095';
const CLOTH_SHADE = '#c5aa78';
const CLOTH_OUTLINE = 'rgba(94,71,42,0.5)';
const INK = '#1c1712';
const EYE_PALE = '#f1e6cd';
const STAIN = 'rgba(196,110,52,0.55)';
const WOOD = '#6e4626';
const WOOD_DARK = '#4f3119';

function bodyPath() {
  ctx.beginPath();
  const left = -36, right = 36, bumps = 5, w = (right - left) / bumps;
  ctx.moveTo(left, -8);
  for (let i = 0; i < bumps; i++) {
    const x0 = left + i * w, x1 = x0 + w, midX = (x0 + x1) / 2;
    ctx.quadraticCurveTo(midX, 12, x1, -8);
  }
  ctx.quadraticCurveTo(46, -44, 33, -84);
  ctx.quadraticCurveTo(25, -100, 13, -102);
  ctx.quadraticCurveTo(0, -104, -13, -102);
  ctx.quadraticCurveTo(-25, -100, -33, -84);
  ctx.quadraticCurveTo(-46, -44, left, -8);
  ctx.closePath();
}

function stainBlob(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = STAIN;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  const pts = 7;
  for (let i = 1; i <= pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const rr = r * (0.7 + 0.3 * Math.sin(i * 2.4));
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.8);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
/*Desenha a cauda em formato de graveto de madeira. Usa
translate até o ponto de encaixe no corpo, depois rotate
(parado + balanço com seno + susto) antes de desenhar o
polígono — uma composição de translação e rotação em
sequência.*/
function tail() {
  ctx.save();
  ctx.translate(38, -18);
  ctx.rotate(0.45 + Math.sin(t * 2.2) * 0.18 + flinchKick());
  ctx.fillStyle = WOOD;
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.lineTo(18, -6);
  ctx.lineTo(11, -11);
  ctx.lineTo(30, -21);
  ctx.lineTo(22, -26);
  ctx.lineTo(38, -38);
  ctx.lineTo(30, -23);
  ctx.lineTo(18, -15);
  ctx.lineTo(25, -7);
  ctx.lineTo(10, 1);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = WOOD_DARK;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(8, 0);
  ctx.lineTo(20, -10);
  ctx.moveTo(18, -16);
  ctx.lineTo(29, -25);
  ctx.stroke();
  ctx.restore();
}
/*Desenha o braço (manga bege) e a patinha preta na ponta.
Também combina translate e rotate para posicionar e balançar
o braço, com um segundo translate interno só para a patinha.*/
function paw() {
  ctx.save();
  ctx.translate(44, -66);
  const sway = -0.55 + Math.sin(t * 2.4) * 0.14 + flinchKick();
  ctx.rotate(sway);
  ctx.fillStyle = CLOTH;
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.lineTo(28, -8);
  ctx.lineTo(35, 2);
  ctx.lineTo(9, 16);
  ctx.closePath();
  ctx.fill();
  ctx.save();
  ctx.translate(35, -3);
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 9.5, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(-5, -7);
  ctx.lineTo(-2, 7);
  ctx.moveTo(3, -8);
  ctx.lineTo(6, 6);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function flinchKick() {
  return Math.sin(Math.min(flinchTimer / 0.5, 1) * Math.PI) * (flinchTimer < 0.5 ? 0.5 : 0);
}

function spiralStroke(cx, cy, maxR, turns) {
  ctx.beginPath();
  const steps = 32;
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * Math.PI * 2 * turns + 0.6;
    const r = maxR * (i / steps);
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r * 0.92;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function eye(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = EYE_PALE;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.lineWidth = 1.5;
  spiralStroke(0, 0, r * 0.72, 1.7);
  ctx.restore();
}

/*Desenha a cabeça inteira (orelhas, rosto, olhos, mancha e
boca). Antes de desenhar, aplica translate → rotate →
translate de volta em torno do pescoço (ponto fixo fora da
origem) para inclinar a cabeça em direção ao mouse. A orelha
direita ainda recebe um cisalhamento (transform com
componente shear) para o efeito de pano balançando*/
function headGroup(isReflection) {
  const neckX = 0, neckY = -97;
  ctx.save();
  ctx.translate(neckX, neckY);
  ctx.rotate(headTilt);
  ctx.translate(-neckX, -neckY);

  ctx.save();
  ctx.translate(-8, -126);
  ctx.rotate(-0.55 + Math.sin(t * 1.4) * 0.05);
  ctx.fillStyle = CLOTH;
  ctx.beginPath();
  ctx.moveTo(-8, 6);
  ctx.quadraticCurveTo(-18, -24, -12, -42);
  ctx.lineTo(-17, -70);
  ctx.quadraticCurveTo(-4, -50, 4, -28);
  ctx.quadraticCurveTo(11, -8, 10, 8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = CLOTH_OUTLINE;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(-12, -42);
  ctx.lineTo(-17, -70);
  ctx.quadraticCurveTo(-3, -52, -1, -37);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(14, -118);
  ctx.transform(1, 0, Math.sin(t * 1.5) * 0.28, 1, 0, 0);
  ctx.fillStyle = CLOTH;
  ctx.beginPath();
  ctx.moveTo(-5, 3);
  ctx.quadraticCurveTo(5, -18, 20, -38);
  ctx.lineTo(32, -28);
  ctx.quadraticCurveTo(22, -12, 27, 3);
  ctx.lineTo(9, 15);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = CLOTH_OUTLINE;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(20, -38);
  ctx.lineTo(32, -28);
  ctx.quadraticCurveTo(27, -20, 23, -15);
  ctx.quadraticCurveTo(14, -25, 20, -38);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(0, -132);
  ctx.fillStyle = CLOTH;
  ctx.beginPath();
  ctx.moveTo(-27, 8);
  ctx.bezierCurveTo(-30, -20, -16, -33, 0, -33);
  ctx.bezierCurveTo(16, -33, 30, -20, 27, 8);
  ctx.bezierCurveTo(26, 22, -26, 22, -27, 8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = CLOTH_OUTLINE;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  if (!isReflection) {
    stainBlob(-16, 15, 7);
  }

  if (!isReflection) {
    eye(-11, -4, 9.5);
    eye(10, -3, 9.5);

    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-10, 10);
    ctx.lineTo(-4, 15);
    ctx.lineTo(1, 9);
    ctx.lineTo(6, 15);
    ctx.lineTo(11, 10);
    ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
}

function drawCharacterLocal(isReflection) {
  if (isReflection) {
    ctx.fillStyle = '#05030a';
    bodyPath();
    ctx.fill();
    ctx.save();
    ctx.translate(0, -132);
    ctx.fillStyle = '#05030a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 27, 32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  tail();
  paw();

  ctx.fillStyle = CLOTH;
  bodyPath();
  ctx.fill();
  ctx.strokeStyle = CLOTH_OUTLINE;
  ctx.lineWidth = 1.3;
  bodyPath();
  ctx.stroke();

  ctx.save();
  ctx.fillStyle = CLOTH_SHADE;
  bodyPath();
  ctx.clip();
  ctx.beginPath();
  ctx.ellipse(-30, -20, 22, 34, 0.3, 0, Math.PI * 2);
  ctx.globalAlpha = 0.35;
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.ellipse(-7, -16, 2.6, 3.8, 0, 0, Math.PI * 2);
  ctx.ellipse(7, -18, 2.6, 3.8, 0, 0, Math.PI * 2);
  ctx.fill();

  headGroup(false);
}
/*Função central de desenho do personagem a cada quadro.
Calcula a escala de profundidade, a respiração (scale
senoidal), o "susto" (salto) e o efeito de andar (squash/stretch);
desenha o reflexo espelhado (scale vertical negativo), o
personagem normal (translate + scale) e, por fim, os espíritos
orbitando (hierarquia de translate + rotate + translate, com o
personagem como "pai" e cada espírito como "filho").*/
function renderCharacter() {
  const b = bounds();
  const depth = clamp((py - b.minY) / (b.maxY - b.minY), 0, 1);
  const depthScale = 0.55 + depth * 0.75;
  const breathe = 1 + 0.025 * Math.sin(t * 2.2);
  const hop = -34 * flinchKick() * 2;
  const s = 0.68 * depthScale * zoom * breathe;
  const squash = walking ? Math.sin(walkPhase) * 0.06 : 0;

  ctx.save();
  ctx.translate(px, py + 4);
  ctx.scale(1, -0.32);
  ctx.translate(0, 10);
  ctx.globalAlpha = 0.22;
  ctx.scale(s, s);
  drawCharacterLocal(true);
  ctx.restore();

  ctx.save();
  ctx.translate(px, py + hop);
  ctx.scale(s * (1 + squash), s * (1 - squash));
  drawCharacterLocal(false);
  ctx.restore();

  ctx.save();
  ctx.translate(px, py - 150 * s);
  wisps.forEach(w => {
    ctx.save();
    ctx.rotate(t * w.speed + w.phase);
    ctx.translate(w.radius * s, 0);
    const bob = Math.sin(t * 3 + w.phase) * 4;
    ctx.translate(0, bob);
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, w.size * 4);
    grd.addColorStop(0, w.color);
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, w.size * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, w.size * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

function updateHeadTilt() {
  if (mouseX !== null) {
    const headWorldX = px;
    const headWorldY = py - 165 * zoom;
    const dx = mouseX - headWorldX;
    const dy = mouseY - headWorldY;
    headTiltTarget = clamp(Math.atan2(dx, -dy) * 0.35, -0.5, 0.5);
  } else {
    headTiltTarget = 0;
  }
  headTilt = lerp(headTilt, headTiltTarget, 0.08);
}

function updateMovement(dt) {
  const b = bounds();
  let moved = false;
  const speed = 220 * dt;

  if (keys.ArrowLeft || keys.a) { px -= speed; moved = true; targetPX = null; }
  if (keys.ArrowRight || keys.d) { px += speed; moved = true; targetPX = null; }
  if (keys.ArrowUp || keys.w) { py -= speed * 0.7; moved = true; targetPX = null; }
  if (keys.ArrowDown || keys.s) { py += speed * 0.7; moved = true; targetPX = null; }

  if (targetPX !== null) {
    const dx = targetPX - px, dy = targetPY - py;
    const dist = Math.hypot(dx, dy);
    if (dist > 2) {
      px += dx * Math.min(1, dt * 4);
      py += dy * Math.min(1, dt * 4);
      moved = true;
    } else {
      targetPX = null;
    }
  }

  px = clamp(px, b.minX, b.maxX);
  py = clamp(py, b.minY, b.maxY);

  walking = moved;
  if (moved) walkPhase += dt * 14; else walkPhase = 0;
}

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { flinchTimer = 0; e.preventDefault(); }
  if (e.key === '+' || e.key === '=') zoom = clamp(zoom * 1.1, 0.6, 2.2);
  if (e.key === '-') zoom = clamp(zoom / 1.1, 0.6, 2.2);
  if (e.key === 'r' || e.key === 'R') { initPosition(); zoom = 1; }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mouseleave', () => { mouseX = null; mouseY = null; });

canvas.addEventListener('click', e => {
  const b = bounds();
  targetPX = clamp(e.clientX, b.minX, b.maxX);
  targetPY = clamp(e.clientY, b.minY, b.maxY);
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = clamp(zoom * (e.deltaY < 0 ? 1.08 : 0.93), 0.6, 2.2);
}, { passive: false });

/*Laço principal de animação, chamado repetidamente por
requestAnimationFrame. Reseta a matriz de transformação a
cada quadro (setTransform), limpa o canvas, desenha o
cenário (céu, árvores, lápides, chão, vaga-lumes), atualiza o
movimento/inclinação e desenha o personagem.*/
function frame(ts) {
  if (lastFrame === null) lastFrame = ts;
  const dt = Math.min(0.05, (ts - lastFrame) / 1000);
  lastFrame = ts;
  t += dt;
  flinchTimer += dt;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  skyAndMoon();

  const b = bounds();
  treeSilhouette(canvas.width * 0.08, b.minY, 1.1, Math.sin(t * 0.3) * 0.02);
  treeSilhouette(canvas.width * 0.95, b.minY - 10, 1.3, Math.sin(t * 0.25 + 1) * 0.02);
  tombstone(canvas.width * 0.2, b.minY + 40, 1);
  tombstone(canvas.width * 0.75, b.minY + 60, 0.85);

  ground();
  fireflyLayer();

  updateMovement(dt);
  updateHeadTilt();
  renderCharacter();

  zoomLabel.textContent = 'zoom: ' + Math.round(zoom * 100) + '%';

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
